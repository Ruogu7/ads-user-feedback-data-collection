<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <style>
    .title{font:700 28px Arial,'Microsoft YaHei',sans-serif;fill:#183b66}.subtitle{font:14px Arial,'Microsoft YaHei',sans-serif;fill:#667085}.box{fill:#fff;stroke:#183b66;stroke-width:2;rx:10}.head{fill:#183b66}.ht{font:700 15px Arial,'Microsoft YaHei',sans-serif;fill:#fff}.txt{font:13px Arial,'Microsoft YaHei',sans-serif;fill:#243b53}.fk{font:12px Arial,'Microsoft YaHei',sans-serif;fill:#167a8a}.line{stroke:#4b6682;stroke-width:2;fill:none}.card{fill:#eaf6f8;stroke:#16a3b6;stroke-width:1.5;rx:8}.ct{font:13px Arial,'Microsoft YaHei',sans-serif;fill:#183b66}.legend{font:12px Arial,'Microsoft YaHei',sans-serif;fill:#667085}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#4b6682"/></marker></defs>
  <rect width="1400" height="980" fill="#f8fbfd"/>
  <text x="55" y="55" class="title">智能驾驶体验调研数据库表关联关系图</text>
  <text x="55" y="82" class="subtitle">主答卷以 record_id 为业务关联键，问卷版本以 version_id 连接题目与答卷；回访联系方式独立分表保存。</text>

  <g transform="translate(510 120)"><rect width="300" height="118" class="box"/><rect width="300" height="34" class="head"/><text x="15" y="23" class="ht">survey_version｜问卷版本</text><text x="15" y="57" class="txt">PK  version_id</text><text x="15" y="78" class="txt">version_code · status</text><text x="15" y="99" class="txt">published_at · version_note</text></g>
  <g transform="translate(900 120)"><rect width="350" height="135" class="box"/><rect width="350" height="34" class="head"/><text x="15" y="23" class="ht">survey_question｜问卷题目</text><text x="15" y="57" class="txt">PK  question_id</text><text x="15" y="78" class="txt">FK  version_id</text><text x="15" y="99" class="txt">question_code · question_type</text><text x="15" y="120" class="txt">options_json · sort_no</text></g>
  <g transform="translate(490 360)"><rect width="370" height="220" class="box"/><rect width="370" height="36" class="head"/><text x="15" y="24" class="ht">survey_response｜主答卷核心表</text><text x="15" y="62" class="txt">PK  record_id</text><text x="15" y="83" class="txt">FK  version_id</text><text x="15" y="104" class="txt">submitted_at · validity_status</text><text x="15" y="125" class="txt">province · city · district</text><text x="15" y="146" class="txt">brand_name · vehicle_model</text><text x="15" y="167" class="txt">trust_score · safety_scores</text><text x="15" y="188" class="txt">reserved_text_01 … 05</text></g>
  <g transform="translate(930 365)"><rect width="350" height="145" class="box"/><rect width="350" height="34" class="head"/><text x="15" y="23" class="ht">survey_answer｜题目答案明细</text><text x="15" y="57" class="txt">PK  answer_id</text><text x="15" y="78" class="txt">FK  record_id · question_id</text><text x="15" y="99" class="txt">answer_option · answer_text</text><text x="15" y="120" class="txt">answer_number · answer_json</text></g>
  <g transform="translate(930 570)"><rect width="350" height="145" class="box"/><rect width="350" height="34" class="head"/><text x="15" y="23" class="ht">risk_event｜风险事件</text><text x="15" y="57" class="txt">PK  risk_event_id</text><text x="15" y="78" class="txt">FK  record_id</text><text x="15" y="99" class="txt">event_type · severity</text><text x="15" y="120" class="txt">review_status · review_note</text></g>
  <g transform="translate(490 690)"><rect width="370" height="145" class="box"/><rect width="370" height="34" class="head"/><text x="15" y="23" class="ht">followup_contact｜自愿回访</text><text x="15" y="57" class="txt">PK  contact_id</text><text x="15" y="78" class="txt">FK  record_id（唯一）</text><text x="15" y="99" class="txt">consent · email_ciphertext</text><text x="15" y="120" class="txt">邮箱加密保存，不进入主导出表</text></g>
  <g transform="translate(60 690)"><rect width="350" height="145" class="box"/><rect width="350" height="34" class="head"/><text x="15" y="23" class="ht">data_review_log｜复核日志</text><text x="15" y="57" class="txt">PK  review_id</text><text x="15" y="78" class="txt">FK  record_id</text><text x="15" y="99" class="txt">reviewer_id · action</text><text x="15" y="120" class="txt">old_status · new_status</text></g>
  <g transform="translate(60 120)"><rect width="300" height="120" class="box"/><rect width="300" height="34" class="head"/><text x="15" y="23" class="ht">team_member｜团队成员</text><text x="15" y="57" class="txt">PK  team_id</text><text x="15" y="78" class="txt">team_name · team_role</text><text x="15" y="99" class="txt">profile_text · status</text></g>
  <g transform="translate(60 365)"><rect width="300" height="135" class="box"/><rect width="300" height="34" class="head"/><text x="15" y="23" class="ht">admin_user｜管理员</text><text x="15" y="57" class="txt">PK  admin_id</text><text x="15" y="78" class="txt">FK  team_id</text><text x="15" y="99" class="txt">account · role_code</text><text x="15" y="120" class="txt">status</text></g>
  <g transform="translate(60 535)"><rect width="300" height="110" class="box"/><rect width="300" height="34" class="head"/><text x="15" y="23" class="ht">export_job｜导出任务</text><text x="15" y="57" class="txt">PK  export_job_id</text><text x="15" y="78" class="txt">FK  created_by</text><text x="15" y="99" class="txt">export_scope · status</text></g>

  <path d="M660 238 L660 360" class="line" marker-end="url(#arrow)"/><text x="675" y="305" class="fk">version_id</text>
  <path d="M810 180 L900 180" class="line" marker-end="url(#arrow)"/><text x="825" y="168" class="fk">version_id</text>
  <path d="M860 430 L930 430" class="line" marker-end="url(#arrow)"/><text x="870" y="418" class="fk">record_id</text>
  <path d="M860 510 L930 630" class="line" marker-end="url(#arrow)"/><text x="870" y="575" class="fk">record_id</text>
  <path d="M675 580 L675 690" class="line" marker-end="url(#arrow)"/><text x="690" y="642" class="fk">record_id</text>
  <path d="M490 515 L410 720" class="line" marker-end="url(#arrow)"/><text x="425" y="620" class="fk">record_id</text>
  <path d="M360 425 L430 425" class="line" marker-end="url(#arrow)"/><text x="370" y="413" class="fk">team_id</text>
  <path d="M210 500 L210 535" class="line" marker-end="url(#arrow)"/><text x="225" y="525" class="fk">admin_id</text>
  <path d="M360 180 L510 180" class="line" marker-end="url(#arrow)"/><text x="405" y="168" class="fk">version_id</text>

  <rect x="55" y="885" width="1290" height="55" class="card"/><text x="75" y="910" class="ct">关系说明：</text><text x="155" y="910" class="legend">1—N：一条主记录对应多条明细；1—0..1：可选的一条回访联系方式。最终统计导出以 validity_status='valid' 的 survey_response 为基础。</text><text x="75" y="929" class="legend">敏感联系方式只保存在 followup_contact，使用加密字段，不与主答卷宽表一并导出。</text>
</svg>
